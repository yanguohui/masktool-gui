# 白名单 - 这些词不会被脱敏
# 适用于常见但非敏感的词汇；同时抑制 jieba NER 的常误报实体
# （如把「严格遵守」「系统安全」「新建」错标为人名/地名）

whitelist:
  # 机构/合同类通用后缀
  - 有限公司
  - 有限责任公司
  - 股份有限公司
  - 集团
  - 项目
  - 合同
  - 协议
  # 常见非敏感误报词（jieba 常误标为 人名/地名/专名）
  - 严格遵守
  - 中华民族
  - 伟大复兴
  - 系统安全
  - 新建
  - 总体
  - 示范
  - 命名
  - 达成
  - 合作
  - 联合
  - 发文
  - 审批
